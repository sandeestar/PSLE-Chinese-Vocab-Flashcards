<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSLE Chinese Vocabulary Flashcards & Vector Grids</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
    }

    .font-heading {
      font-family: 'Fredoka', 'Noto Sans SC', sans-serif;
    }

    /* A4 Print Layout Settings */
    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
      body {
        background: white !important;
        color: black !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-page-break {
        page-break-after: always;
        break-after: page;
      }
      .print-grid {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12px !important;
      }
      .print-card {
        border: 1.5px solid #E2E8F0 !important;
        box-shadow: none !important;
        background: white !important;
        break-inside: avoid;
        page-break-inside: avoid;
        height: 52mm !important;
      }
      .print-title {
        display: block !important;
        font-size: 16pt;
        font-weight: bold;
        text-align: center;
        margin-bottom: 12px;
        padding-bottom: 4px;
        border-bottom: 2px solid #0284C7;
      }
    }

    /* 3D Card Flip Effects for Practice Mode */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    .flipped .card-inner {
      transform: rotateY(180deg);
    }

    /* Vector Container Styling */
    .illustration-box {
      background: radial-gradient(circle at center, #F8FAFC 0%, #EDF2F7 100%);
      transition: all 0.25s ease;
    }
    .card-item:hover .illustration-box {
      transform: scale(1.03);
      background: radial-gradient(circle at center, #EFF6FF 0%, #DBEAFE 100%);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

            <i data-lucide="grid" class="w-3.5 h-3.5"></i>
            <span>Grid View</span>

          <button id="btn-flashcard" onclick="setMode('flashcard')" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5">

            <span>Quiz Game</span>

        </div>

        <button onclick="window.print()" class="flex items-center gap-1.5 px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-sm font-semibold shadow-sm transition">
          <i data-lucide="printer" class="w-4 h-4"></i>
          <span>Print A4 PDF</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Search & Category Filters Bar -->

    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">

      <div class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0">
        <label for="category-select" class="text-xs font-bold text-slate-400 uppercase tracking-wider whitespace-nowrap">Category:</label>
        <select id="category-select" onchange="filterCategory(this.value)" class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500 p-2 font-medium">
          <option value="ALL">All 10 Lists (100 Illustrated Items)</option>
          <option value="1">List 1: Tools 工具</option>
          <option value="2">List 2: In the Kitchen 厨房用具</option>
          <option value="3">List 3: Furniture 家具</option>
          <option value="4">List 4: Bathroom 浴室</option>
          <option value="5">List 5: Cleaning 清洁用品</option>
          <option value="6">List 6: Stationery 文具</option>
          <option value="7">List 7: Home Appliances 家用电器</option>

          <option value="9">List 9: Personal Items 随身物品</option>
          <option value="10">List 10: Outdoors & Bikes 户外骑行</option>
        </select>
      </div>

      <!-- Search Input & Display Toggles -->
      <div class="flex flex-wrap items-center gap-3">
        <div class="relative flex-1 min-w-[220px]">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Search 中文, Pinyin, or English..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>

        <div class="flex items-center gap-3 bg-slate-100 p-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-700">
          <label class="flex items-center gap-1.5 cursor-pointer select-none">
            <input type="checkbox" id="toggle-pinyin" checked onchange="renderCards()" class="rounded text-sky-600 focus:ring-sky-500 w-4 h-4">
            <span>Pinyin</span>
          </label>

            <input type="checkbox" id="toggle-english" checked onchange="renderCards()" class="rounded text-sky-600 focus:ring-sky-500 w-4 h-4">
            <span>English</span>
          </label>
        </div>
      </div>

    </div>
  </section>

        <svg viewBox="0 0 120 120" class="w-full h-full drop-shadow-sm" xmlns="http://www.w3.org/2000/svg">

    }

    let currentMode = 'grid'; // 'grid' | 'flashcard' | 'quiz'
    let currentCategory = 'ALL';
    let searchQuery = '';
    let quizQuestions = [];
    let currentQuizIndex = 0;
    let quizScore = 0;

    /* Speech Synthesis Helper */
    function speakChinese(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    function setMode(mode) {
      currentMode = mode;
      
      // Update Button Styles
      ['grid', 'flashcard', 'quiz'].forEach(m => {
        const btn = document.getElementById(`btn-${m}`);
        if (m === mode) {
          btn.className = "px-3 py-1.5 rounded-lg bg-white text-sky-700 shadow-sm font-bold transition flex items-center gap-1.5";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 font-semibold transition flex items-center gap-1.5";
        }
      });

      if (mode === 'quiz') {
        document.getElementById('grid-container').classList.add('hidden');
        document.getElementById('quiz-container').classList.remove('hidden');
        startQuiz();
      } else {
        document.getElementById('grid-container').classList.remove('hidden');
        document.getElementById('quiz-container').classList.add('hidden');
        renderCards();
      }
    }

    function filterCategory(cat) {
      currentCategory = cat;
      if (currentMode === 'quiz') startQuiz();
      else renderCards();
    }

    function handleSearch(query) {
      searchQuery = query.toLowerCase().trim();
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('grid-container');
      const showPinyin = document.getElementById('toggle-pinyin').checked;
      const showEnglish = document.getElementById('toggle-english').checked;

      let filtered = VOCAB_DATA.filter(item => {
        const matchesCategory = (currentCategory === "ALL") || (item.listId.toString() === currentCategory);
        const matchesSearch = !searchQuery || 
          item.english.toLowerCase().includes(searchQuery) ||
          item.chinese.includes(searchQuery) ||
          item.pinyin.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 bg-white rounded-3xl border border-dashed border-slate-300">
            <i data-lucide="search-x" class="w-12 h-12 text-slate-400 mx-auto mb-3"></i>
            <p class="text-slate-600 font-semibold">No vocabulary items match your search.</p>
            <p class="text-xs text-slate-400 mt-1">Try searching another term or resetting filters.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // Group cards by Category List Title
      const groups = {};
      filtered.forEach(item => {
        if (!groups[item.listTitle]) groups[item.listTitle] = [];
        groups[item.listTitle].push(item);
      });

      let html = '';

      for (const [title, items] of Object.entries(groups)) {
        html += `
          <section class="print-page-break">
            <div class="flex items-center justify-between mb-4 border-b border-sky-200 pb-2">
              <h2 class="text-lg font-heading font-bold text-sky-950 print-title flex items-center gap-2">
                <span class="w-2.5 h-6 bg-sky-600 rounded-full inline-block no-print"></span>
                ${title}
              </h2>
              <span class="text-xs font-bold px-3 py-1 bg-sky-100 text-sky-800 rounded-full no-print">
                ${items.length} Vector Cards
              </span>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 print-grid">
              ${items.map(item => renderSingleCard(item, showPinyin, showEnglish)).join('')}
            </div>
          </section>
        `;
      }

      container.innerHTML = html;
      lucide.createIcons();
    }

    /* Single Card Renderer */
    function renderSingleCard(item, showPinyin, showEnglish) {
      const vectorSvg = getVectorSvg(item.id, item.listId);

      if (currentMode === 'flashcard') {
        // Flashcard Flip Mode
        return `
          <div onclick="this.classList.toggle('flipped')" class="group perspective-1000 cursor-pointer h-52 select-none">
            <div class="card-inner relative w-full h-full duration-500 transform-style-3d transition-transform bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md p-3 flex flex-col items-center justify-between">
              
              <!-- Front Side -->
              <div class="absolute inset-0 bg-white rounded-2xl p-3 flex flex-col items-center justify-between backface-hidden">
                <div class="w-full h-28 illustration-box rounded-xl p-2 flex items-center justify-center">
                  ${vectorSvg}
                </div>
                <div class="text-center w-full">
                  <span class="text-[10px] font-bold text-sky-600 uppercase tracking-wider block">Tap to Reveal</span>
                  <p class="text-sm font-semibold text-slate-800 truncate">${item.english}</p>
                </div>
              </div>

              <!-- Back Side -->
              <div class="absolute inset-0 bg-gradient-to-br from-sky-600 to-indigo-700 text-white rounded-2xl p-4 flex flex-col items-center justify-center rotate-y-180 backface-hidden text-center shadow-inner">
                <p class="text-3xl font-heading font-bold mb-1">${item.chinese}</p>
                <p class="text-sm font-medium text-sky-200 mb-4">${item.pinyin}</p>
                <button onclick="event.stopPropagation(); speakChinese('${item.chinese}')" class="px-3.5 py-1.5 bg-white/20 hover:bg-white/30 rounded-full text-xs font-semibold backdrop-blur-sm flex items-center gap-1.5 transition">
                  <i data-lucide="volume-2" class="w-4 h-4"></i> Audio
                </button>
              </div>

            </div>
          </div>
        `;
      }

      // Standard Grid Card Mode
      return `
        <div class="card-item print-card bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition p-3 flex flex-col items-center justify-between text-center relative group">
          
          <button onclick="speakChinese('${item.chinese}')" title="Listen Pronunciation" class="no-print absolute top-2 right-2 p-1.5 text-slate-400 hover:text-sky-600 hover:bg-sky-50 rounded-lg transition z-10">
            <i data-lucide="volume-2" class="w-4 h-4"></i>
          </button>

          <!-- Vector Illustration Container -->
          <div class="w-full h-28 illustration-box rounded-xl p-2 flex items-center justify-center mb-2">
            ${vectorSvg}
          </div>

          <!-- Text Labels -->
          <div class="w-full flex flex-col items-center">
            ${showPinyin ? `<span class="text-xs font-medium text-sky-600 tracking-wide">${item.pinyin}</span>` : ''}
            <span class="text-xl font-heading font-bold text-slate-900 leading-snug my-0.5">${item.chinese}</span>
            ${showEnglish ? `<span class="text-xs font-medium text-slate-500 truncate w-full">${item.english}</span>` : ''}
          </div>

        </div>
      `;
    }

    function startQuiz() {
      let filtered = VOCAB_DATA.filter(item => (currentCategory === "ALL") || (item.listId.toString() === currentCategory));
      
      // Shuffle & Select 10 items
      quizQuestions = [...filtered].sort(() => 0.5 - Math.random()).slice(0, 10);
      currentQuizIndex = 0;
      quizScore = 0;

      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const container = document.getElementById('quiz-container');
      if (currentQuizIndex >= quizQuestions.length) {
        // Quiz Complete
        container.innerHTML = `
          <div class="space-y-4 py-6">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">🎉</div>
            <h2 class="text-2xl font-heading font-bold text-slate-900">Quiz Completed!</h2>
            <p class="text-slate-600 font-medium">You scored <span class="text-sky-600 font-bold text-xl">${quizScore}</span> out of ${quizQuestions.length}</p>
            <button onclick="startQuiz()" class="px-6 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-xl shadow-md transition">
              Try Again
            </button>
          </div>
        `;
        return;
      }

      const current = quizQuestions[currentQuizIndex];
      const vectorSvg = getVectorSvg(current.id, current.listId);

      // Generate 4 Multiple Choice Options
      let options = [current];
      while (options.length < 4) {
        const rand = VOCAB_DATA[Math.floor(Math.random() * VOCAB_DATA.length)];
        if (!options.find(o => o.id === rand.id)) options.push(rand);
      }
      options.sort(() => 0.5 - Math.random());

      container.innerHTML = `
        <div class="flex items-center justify-between text-xs font-bold text-slate-400 border-b pb-3">
          <span>Question ${currentQuizIndex + 1} of ${quizQuestions.length}</span>
          <span>Score: ${quizScore}</span>
        </div>

        <!-- Illustration Prompt -->
        <div class="w-36 h-36 mx-auto illustration-box rounded-2xl p-3 flex items-center justify-center shadow-inner">
          ${vectorSvg}
        </div>

        <div>
          <h3 class="text-lg font-heading font-bold text-slate-800">What is the Chinese term for this item?</h3>
          <p class="text-xs text-slate-500 font-medium">${current.english}</p>
        </div>

        <!-- Options Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
          ${options.map(opt => `
            <button onclick="checkAnswer(${opt.id === current.id}, this)" class="p-3.5 border-2 border-slate-200 hover:border-sky-500 rounded-2xl font-bold text-slate-800 hover:bg-sky-50 transition flex items-center justify-between">
              <span class="text-lg">${opt.chinese}</span>
              <span class="text-xs font-medium text-slate-400">${opt.pinyin}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    function checkAnswer(isCorrect, btn) {
      if (isCorrect) {
        quizScore++;
        btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-500');
      } else {
        btn.classList.add('bg-rose-500', 'text-white', 'border-rose-500');
      }

      setTimeout(() => {
        currentQuizIndex++;
        renderQuizQuestion();
      }, 700);
    }

    // Initialize on page load
    window.onload = function() {
      renderCards();
    };
  </script>
</body>
</html>
